長輩走失請馬上撥 110 報案，不需要等 24 小時，準備好近照和今天的穿著。跌倒撞到頭、突然叫不醒、說不出話，或嗆到後發燒，請撥 119 或盡快就醫。`,hot:["110","119"]}],G1=["極輕度","輕度失智","中度失智","重度失智","什麼是失智","失智症是什麼","阿茲海默","路易氏","路易體","額顳葉","血管性失智","血管型失智","帕金森","分期","第幾期","CDR","病程","正常老化","老化還是","是不是老了","失智的原因","失智症的原因","類型","年輕型","早發性","末期"],F1=[{id:"repeat",five:"重複問・重複行為",title:"一直問同一件事、重複做同一件事",cat:"五大困擾",src:"改編自 106-1 失智症課程講義 Week 3〈BPSD〉、Week 11〈早發性失智症〉",kw:["重複","一直問","問同一件事","問很多次","問了又問","一直講","反覆","一直說","一直重複","同一句","開關抽屜","一直買","囤積","買很多"],sum:"同一件事問了十遍，不是故意的。先平靜回答，再轉移注意力，並把家裡布置成「看得到答案」。",sec:[{h:"常見的情況",p:"每隔幾分鐘就問「今天幾號」「吃飯了沒」「女兒什麼時候回來」。也可能一直開關抽屜、摺同一件衣服、來回收東西，停不下來。"},{h:"為什麼會這樣",p:"失智會讓人記不住剛剛聽到的答案，所以每次問都像第一次問。心裡不安、無聊，或想表達需求（餓了、想上廁所、怕被丟下）時，會問得更頻繁。重複動作則常是大腦「卡住」，很難自己停下來。"},{h:"先這樣回應",li:["平靜地再回答一次，不說「您剛剛問過了」。","想想問題背後的擔心：一直問幾點吃飯，可能是餓了，也可能是怕沒人理他。","先回應感受：「您在等女兒回來，對不對？她下午五點就到。」"]},{h:"轉移注意力",li:["換到他熟悉、擅長的話題，例如以前的工作、老家、拿手菜。","請他幫忙做簡單的事：摺毛巾、挑菜、澆花、擦桌子。","一起聽老歌、看老照片，或到另一個房間、陽台走一走。","給他一件安全、可以一直做的事，例如整理一盒鈕扣、捲毛線，讓重複動作有地方去。"]},{h:"居家環境再造",li:["在他常坐的位置放大字日曆和時鐘。","用白板寫「今天的安排」，他問的時候一起看。","常問的答案寫成小卡，例如「女兒下午 5 點回來」，貼在看得到的地方。","抽屜、櫃子貼上文字或照片，標示裡面放什麼。","常找的東西固定放在同一個看得到的位置，減少雜物和噪音。"]},{h:"一直買同樣的東西",li:["常見的是每隔一兩天就買一大包衛生紙，或冰箱裡堆滿同樣的食物。原因多半是忘了家裡已經有。","跟常去的店家、鄰居打聲招呼，請他們留意，有狀況時通知您。","把買回來的東西放在看得到的固定位置，出門前一起看購物清單。","定期幫忙整理冰箱。過期的食物趁他不在時處理，或說「我幫您換新的」，避免他捨不得、覺得浪費而焦慮。","錢包裡少放現金，減少一次買太多。"],ref:["S4-022","S4-019","S2-008"]},{h:"什麼時候要求助",p:"如果最近突然問得特別多，或同時變得混亂、嗜睡，可能是身體出了狀況，請盡快就醫。照顧者被問到快要崩潰時，請打家庭照顧者關懷專線，或申請喘息服務。"}]},{id:"wander",five:"遊走",title:"一直想出門與防走失",cat:"五大困擾",src:"改編自 106-1 失智症課程講義 Week 14〈社會資源運用〉、Week 13〈治療性環境〉、Week 12〈倫理議題〉",kw:["出門","出去","往外走","走失","回家","遊走","亂走","開門","跑出去","防走失","手鍊","定位","迷路","騎車","機車","開車","駕照"],sum:"長輩想出門，通常有他的理由。先了解原因，再用科技輔具和居家環境改善做好防走失。",sec:[{h:"常見的情況",p:"長輩說要回家、要去上班、要去田裡，一直往門口走。趁家人午睡或不注意時出門，可能就找不到回家的路。"},{h:"為什麼會這樣",p:"他想回的可能是小時候的家，或還照著過去的生活習慣，例如每天去田裡巡視、去朋友家聊天。對他來說，這是生活的重心和身分。也可能是無聊、焦慮、想上廁所或身體不舒服。記憶和方向感變差，出門後就容易迷路。"},{h:"先這樣回應",li:["先問他要去哪裡、要做什麼，順著他的話聊。","陪他出去走一段，再自然地繞回家。","白天安排活動和散步，消耗體力。","硬性禁止出門常讓他更焦躁，甚至偷偷出門；可以改成有人陪、固定時間出門，或安排白天去失智據點。"],ref:["S2-009"]},{h:"還在騎車、開車怎麼辦",li:["注意力和判斷力變差後，騎車、開車容易出事，也容易迷路。","直接沒收鑰匙常引起衝突。可以請醫師一起說明，並先安排替代方式：家人接送、社區交通接送、陪同搭車。","75 歲以上換駕照需要通過認知功能測驗，也可以藉這個機會和他談。"],ref:["S2-009","S2-003"]},{h:"科技輔具",li:["定位手錶、定位手機、AirTag 或鞋墊型定位器：走失時能查到位置。","門窗感應器、門鈴、活動感知器：有人開門或在屋內走動時通知家人。","離床感應墊：半夜下床時提醒家人。","長照的「安全監視輔具」可申請補助，請向 1966 詢問。","使用定位裝置前，盡量先取得長輩本人的同意。"],ref:["S2-005","S3-001"]},{h:"居家環境改善",li:["大門用布簾或和牆壁同色的貼紙遮住，降低想開門的念頭。","門口掛鈴鐺，或把門鎖裝在比較高或比較低、不顯眼的位置。","外出鞋、包包、鑰匙收起來，不放在門口。","晚上留小夜燈照亮往廁所的路，避免半夜找廁所時走錯到門外。","在室內或院子安排一條可以安全來回走的路線。"]},{h:"萬一走失的準備",li:["申請愛心手鍊：以臺中市為例，65 歲以上，或經醫師診斷有走失風險者，可帶身分證影本與診斷證明到區公所申請，符合資格免費。手鍊上有編號和 24 小時協尋電話，但沒有定位功能。其他縣市的申請方式請洽當地區公所或社會局。","衣服縫上愛心布標，或讓長輩隨身帶聯絡資料。","到警察局做指紋建檔。","請熟識的鄰居、店家留意，看到他獨自在外時通知您。","準備一張近照，每天出門前記下他穿的衣服。"],ref:["S2-006","S4-007"]},{h:"什麼時候要求助",p:"長輩走失時，請立刻撥 110 報案，不需要等 24 小時。提供照片、穿著和可能去的地方，例如老家、以前的工作地點。"}]},{id:"stolen",five:"妄想",title:"長輩一直說東西被偷",cat:"五大困擾",src:"改編自 106-1 失智症課程講義 Week 3〈BPSD〉、Week 7〈家庭照顧者〉",kw:["偷","被偷","藏","錢包","誣賴","懷疑","找不到東西","東西不見","存摺","鑰匙","妄想","有人要害","下毒","外遇","不貞"],sum:"「我的錢包被偷了」常常不是故意找麻煩，而是記憶和判斷力受影響。",sec:[{h:"常見的情況",p:"長輩找不到錢包、存摺或首飾，就認定是家人或看護偷走，越解釋越生氣，有時還會罵人、動手。最常被懷疑的，往往是每天照顧他的人。"},{h:"為什麼會這樣",p:"長輩忘了自己把東西收在哪裡，大腦會自己補一個說法，例如「一定是有人拿走」。有時是判斷力受影響，形成很難改變的想法，也就是妄想。這不是品格問題，是疾病的症狀。"},{h:"先這樣回應",li:["先接住情緒：「找不到很著急吧，我陪您一起找。」","不爭辯是不是被偷，也不急著證明清白。","陪他找，盡量讓他自己找到，比直接拿出來更好。","記下他常藏東西的地方，例如枕頭下、衣櫃深處、冰箱或洗衣機裡。","證件和存摺留影本，鑰匙多打一副，家裡少放大量現金。","先跟其他家人說明這是症狀，避免家人之間互相猜疑。"]},{h:"懷疑看護下毒、不肯吃藥",li:["剛換新看護、語言又不通時，長輩更容易起疑心。","改由長輩信任的家人陪著吃藥，或讓他看著藥從藥袋拿出來、自己拿起來吃。","不要硬塞或偷偷把藥混進食物裡，先問醫師或藥師有沒有其他做法。","向看護說明這是疾病症狀，不是針對她，也讓看護知道可以怎麼回應。"],ref:["S4-014"]},{h:"懷疑另一半外遇",li:["有些長輩在傍晚或配偶出門時特別不安，懷疑另一半去找別人。這也是妄想的一種，對照顧的配偶傷害很大。","出門前先告訴他去哪裡、幾點回來，也可以留一張紙條在他看得到的地方。","回家時先安撫：「我回來了，剛去買菜。」不要急著爭辯。","這種情況容易讓主要照顧者心力交瘁，請盡早回診和醫師討論，也找人分擔照顧。"],ref:["S4-012","S4-013"]},{h:"什麼時候要求助",p:"如果懷疑的情況越來越多，開始看到不存在的人、攻擊別人，或拒絕吃飯吃藥，請回診告訴醫師。也要留意東西真的遺失、被詐騙的可能。"}]},{id:"sleep",five:"日夜顛倒",title:"日夜顛倒、半夜不睡",cat:"五大困擾",src:"改編自 106-1 失智症課程講義 Week 3〈BPSD〉",kw:["睡","失眠","半夜","日夜顛倒","白天睡","晚上不睡","夜裡","醒來","不睡覺","曬太陽","作息"],sum:"白天一直睡、半夜起來走動，照顧者跟著睡不好，是很常見的困擾。",sec:[{h:"常見的情況",p:"長輩白天打瞌睡，晚上卻醒著，半夜起來翻東西、要出門，或叫醒家人。照顧的家人為了陪伴常常整夜沒睡，白天上班也撐不住。"},{h:"為什麼會這樣",p:"年紀大本來就比較淺眠、容易早醒；失智又會讓大腦裡調節睡眠的「生理時鐘」退化，睡眠和清醒的節律跟著變亂。白天活動少、照光少，晚上就更睡不著。疼痛、便祕、頻尿、呼吸不順也會讓人醒來。"},{h:"先這樣做",li:["固定起床和上床時間，週末也一樣。","白天多活動，午睡時間短一點。","傍晚以後少喝茶、咖啡，睡前少喝水、先上廁所。","房間保持安靜、偏暗，留一盞小夜燈避免跌倒。","半夜醒來時不要開大燈或吵架，陪他上廁所、喝口水，再慢慢帶回床上。","不要自行給安眠藥，要先和醫師討論。"]},{h:"白天多照光",li:["早上到戶外散步、曬太陽最推薦，大約半小時到兩小時。","如果傍晚特別煩躁，又有日夜顛倒，早上和傍晚各照光一次，有助於改善。","待在室內時，白天把窗簾拉開，讓家裡夠亮。","市面上的光照箱要用多亮、照多久，請先問醫師或職能治療師。"],ref:["S5-014","S5-015"]},{h:"排一張一日作息表",li:["把起床、三餐、散步、活動、洗澡、上床時間寫成一張表，貼在看得到的地方，每天照著走。","白天安排他有興趣、做得到的事，例如澆花、種菜、摺衣服，讓身體適度累一點。","作息表也能讓輪班照顧的家人、看護用同一套方法。"],ref:["S4-009","S5-016"]},{h:"什麼時候要求助",p:"如果長輩晚上大叫、手腳亂動像在作夢打架，或打鼾很大聲、呼吸停頓，請告訴醫師。照顧者自己已經連續好幾天睡不好，請考慮申請喘息服務。"}]},{id:"refuse",five:"拒絕照顧・煩躁",title:"不肯洗澡、吃藥、吃飯、刷牙",cat:"五大困擾",src:"改編自 106-1 失智症課程講義 Week 3〈BPSD〉、Week 13〈治療性環境〉",kw:["洗澡","不洗","拒絕","不肯","不吃藥","吃藥","換衣服","推開","抗拒","不配合","刷牙","不讓我","不吃飯","吃過了","吃不停","不肯吃"],sum:"長輩拒絕照顧，常常是怕、不懂或不舒服。換個說法、換個時間，一次只做一步。",sec:[{h:"常見的情況",p:"一說要洗澡就生氣，堅持「我洗過了」「身體不髒」；不肯吃藥、不肯換衣服、不肯刷牙，甚至大聲罵人、推開照顧的人。每天為了這些事吵架，雙方都很累。"},{h:"為什麼會這樣",p:"他可能怕冷、怕水、怕滑倒，或覺得身體被看光很難堪。步驟太多、聽不懂要做什麼，也會讓人抗拒。身體疼痛、太累的時段，抗拒會更明顯。"},{h:"先這樣做",li:["選他精神好、心情好的時段，不要在傍晚硬來。","不說「去洗澡」，改說「我們去泡泡腳、暖暖身子」。","浴室先弄暖，毛巾和衣服先準備好。","一次只說一個步驟，他做得到的部分讓他自己做。","用大浴巾蓋住身體，保護隱私；可以的話由同性家人協助。","今天真的不肯，就先擦澡，改天再試，不必每天硬碰硬。","吃藥跟固定的事綁在一起，例如早餐後；不要自行把藥磨碎或混在食物裡，先問醫師或藥師。"]},{h:"讓浴室更安全",li:["放洗澡椅、裝扶手、鋪止滑墊。","用可以拿下來的蓮蓬頭，坐著就能洗。","水溫先調好，避免燙到或太冷。"]},{h:"說已經吃過、不肯吃飯",li:["不爭辯吃過沒，改說「陪我吃一點」「這是剛做好的」。","固定時間提醒吃飯，把餐點放在他看得到的地方。","一次只放一道菜，吃完再上下一道，比較能專心吃。","尊重他的口味改變，在健康原則下多試幾種食物。","有在吃降血糖藥的長輩不肯吃飯，容易低血糖，請記下每天吃了什麼，回診時告訴醫師。","咀嚼或吞嚥變差時，可改成切小塊、剁碎或軟質的食物；喝水容易嗆到，請先請語言治療師評估。"],ref:["S1-008","S4-009","S4-014"]},{h:"一直說沒吃、吃不停",li:["剛吃完又說沒吃，甚至說家人不給飯吃，多半是忘了已經吃過。","把一餐分成兩三次給，或飯後準備水果、小點心，再陪他做別的事轉移注意力。","向其他家人說明這是症狀，避免誤會負責煮飯的人。"],ref:["S1-008","S4-014"]},{h:"不肯刷牙",li:["用簡單、重複的短句：「張開嘴巴」「吐水」。","您先刷一次給他看，再請他跟著做。","換成大握把牙刷或電動牙刷，比較好拿。","抗拒時先安撫、轉移注意力，不要強行刷。","中重度時，可以用指套牙刷或海綿牙刷幫他清潔；每天看看嘴裡有沒有破洞、出血、殘渣。"],ref:["S1-007"]},{h:"讓情緒先穩下來",li:["不批判對錯，先聽他說，接受他當下的感受。","用他剛說的關鍵字回應，例如他說「我不要洗」，就說「您今天不想洗，是覺得冷嗎？」","語氣放慢、聲音放低，看著他的眼睛。","有些長輩抱著布娃娃會比較安心；但不要把娃娃當成交換條件，例如「洗完澡才給您娃娃」。"],ref:["S5-014","S5-016","S5-017"]},{h:"什麼時候要求助",p:"如果突然不吃不喝、體重下降，或碰到某個部位就喊痛，請盡快就醫。抗拒時出現打人等攻擊行為，請回診和醫師討論。"}]},{id:"dusk",five:"拒絕照顧・煩躁",title:"黃昏一到就煩躁不安",cat:"五大困擾",src:"改編自 106-1 失智症課程講義 Week 3〈BPSD〉",kw:["黃昏","傍晚","日落","躁動","煩躁","焦躁","天黑","大叫","晚上","坐不住","吵"],sum:"傍晚到晚上變得煩躁、來回走、吵著要回家，是常見的「日落症候群」。",sec:[{h:"常見的情況",p:"傍晚到晚上，長輩開始坐立不安、來回走動、吵著要回家煮飯、說家人要下班了，或抗拒吃飯、洗澡，有時大叫、拍打東西。白天明明還好，天一暗就像換了一個人。"},{h:"為什麼會這樣",p:"失智會打亂身體的生理時鐘。白天太累、白天曬太陽太少，都會讓傍晚更不穩。傍晚家裡往往也最忙：煮飯、下班回家、看護交班，光線變暗、聲音變多，長輩更容易不安。"},{h:"先這樣做",li:["白天多到窗邊或戶外照光，上午安排散步或活動。","傍晚前先把燈打開，關小電視，減少訪客和噪音。","把洗澡、換衣這類容易起衝突的事，改到上午或下午。","陪他做熟悉的事轉移注意力，例如摺衣服、聽老歌、喝杯熱茶。","不爭辯、不責罵，用平穩的語氣說：「我們先喝杯茶，等一下再看看。」"]},{h:"他說要回家煮飯、等家人下班",li:["他可能回到了過去當家庭主婦或上班的時光。不必糾正「爸爸已經過世了」，這會讓他再傷心一次。","先順著他的心意：「您很擔心大家沒飯吃，對不對？」","請他幫忙擺碗筷、洗菜，讓「煮飯」的心意有地方去。"],ref:["S4-014","S5-014"]},{h:"什麼時候要求助",p:"如果最近突然變嚴重，或伴隨發燒、疼痛、便祕、頻尿，可能是身體不舒服或譫妄，請盡快就醫。剛換藥後變嚴重，也要告訴醫師。有人可能受傷時，請撥 119。"}]},{id:"selfcare",five:"",title:"讓家人自己做得到：自立支援的照顧方法",cat:"日常照顧",src:"自立支援照顧策略",kw:["自己做","自立","穿衣","穿衣服","幫他做","代勞","太慢","不會做","生活能力","步驟","退化","什麼都不會"],sum:"全部幫他做比較快，卻會讓他退化得更快。把事情拆成小步驟、給剛好的提示，讓他盡量自己完成。",sec:[{h:"為什麼不要全部幫他做",p:"為了省時間，家人常直接幫長輩穿好衣服、端好飯。但能力不用就會退得更快，長輩也會覺得自己沒用。自立支援的目標不是要他什麼都自己來，而是在安全、有尊嚴的前提下，讓他盡量參與自己的生活。",ref:["S3-007","S3-009"]},{h:"步驟一：把事情拆成小步驟",li:["以穿上衣為例：從固定位置拿衣服 → 放在腿上 → 找到領口 → 認出前後 → 抓住領口兩邊 → 頭穿過去 → 一隻手伸進袖子 → 另一隻手伸進袖子 → 往下拉好 → 照鏡子整理。","先觀察他哪幾步自己做得到、卡在哪一步，只幫卡住的那一步。","步驟可以依衣服款式和他的習慣調整，不必每個人都一樣。"],ref:["S3-004","S3-006"]},{h:"步驟二：提示從少給到多",li:["看得到的提示：照片、圖卡、步驟清單。例如在洗手台旁貼「開水 → 擠洗手乳 → 搓手 → 沖水 → 擦乾」。","手勢或一句短短的話：指一下袖口，說「手伸進來」。","示範：您先做一次，動作慢、一次一個步驟，再請他跟著做。","少量協助：他已經拿起牙刷，只幫忙調一下手的方向。","大量協助：在他同意、安全的情況下，扶著他的手完成動作；不可以硬拉。","原則是只給完成這一步需要的最少協助。"],ref:["S3-005","S3-007","S3-008"]},{h:"步驟三：先等一下",li:["說完一句話，先等他反應，不要馬上重複或接手。","分辨他是「還沒開始」「正在試」，還是「真的需要幫忙」。","動作慢不代表做不到。等待的時間依他的反應速度調整。"],ref:["S3-009","S3-013"]},{h:"步驟四：具體稱讚",li:["說出他做到了什麼：「您自己找到袖口了！」「您自己把碗放好了！」","只完成一步也值得肯定，不要因為沒做完整套就否定他。","避免只說「乖」「快一點」。"],ref:["S3-005","S3-014"]},{h:"步驟五：一次只多加一步",li:["從他現在做得到的開始，先讓他有成功的經驗。","這一步穩定了，再加下一步，或減少一點提示。","如果他開始挫折、生氣，就降低要求、重新示範，或調整環境。","可以簡單記錄每一步是「自己完成」「提示後完成」還是「幫忙後完成」，看得到進步。"],ref:["S3-015","S3-016","S3-007"]},{h:"調整環境，讓他更容易做到",li:["常用的東西放在固定、好拿的位置，貼上照片或文字標籤。","給選擇：「今天想穿藍色還是綠色？」","桌上一次只放需要的東西，減少分心。","視力不好時，加強顏色對比，例如白碗放在深色餐墊上。","聽力不好時，多用手勢、示範和文字。","用每日作息表和固定流程，讓他知道下一步要做什麼。"],ref:["S3-008","S3-018"]},{h:"安全與意願優先",p:"有吞嚥困難、跌倒風險或特殊飲食的長輩，練習前先問專業人員該注意什麼。他有權決定要不要做、要怎麼被協助，不要勉強；今天狀況不好，就換個時間再試。",ref:["S3-018"]}]},{id:"activity",five:"",title:"在家可以一起做的陪伴活動",cat:"日常照顧",src:"失智症非藥物照顧方法",kw:["活動","無聊","沒事做","做什麼","懷舊","老照片","音樂","娃娃","園藝","打發時間","無所事事","陪他"],sum:"不用藥也能幫助長輩情緒穩定、睡得好。從他過去的生活和興趣出發，安排有意義的小事。",sec:[{h:"為什麼要安排活動",p:"非藥物的照顧方法安全、副作用少，是改善煩躁、睡不好、憂鬱等症狀的第一步。長輩無所事事、覺得自己沒用時，情緒和行為問題會更多。",ref:["S5-003","S4-014"]},{h:"從他是誰開始想",li:["他以前做什麼工作、有什麼專長、喜歡做什麼？","他過去每天的作息和習慣是什麼？","找出他現在還做得到、而且對他有意義的事，例如以前務農的長輩澆花種菜，以前當主婦的長輩挑菜、摺衣服。"],ref:["S5-017"]},{h:"幫他知道現在是什麼時候",li:["家裡放大字時鐘、日曆，或一塊白板寫上日期、天氣、今天的安排。","每次互動時，先自我介紹：「爸，我是小美。」","聊聊現在的時間、天氣、窗外的景色。","要幫他做什麼之前先說明並詢問：「現在我要幫您換衣服，可以嗎？」做完說謝謝。"],ref:["S5-005","S5-006"]},{h:"一起回憶過去",li:["拿出老照片、老歌、童玩、以前的物品，聊兒時、求學、工作、結婚、節慶。","不考他記憶，也不糾正他說的內容；每個人記得的本來就不一樣。","用「那時候是怎麼樣的？」這類開放問題引導，給他足夠時間回答。","聊到傷心的回憶時，溫和地轉到其他話題。"],ref:["S5-007","S5-010","S5-011"]},{h:"動手做、動身體",li:["園藝：澆花、播種、換盆、插花，可以在陽台或院子做；活動身體也有助於晚上睡得好。","聽音樂、唱老歌、跟著節奏拍手。","簡單的分類、摺疊、整理工作。","有些長輩抱著布娃娃、跟娃娃說話會比較安心；娃娃要是他專屬的，但不要拿來交換條件。"],ref:["S5-016","S5-017"]},{h:"注意事項",p:"活動以他開心、做得到為原則，時間不必長，累了就停。病程會改變，能做的事也會跟著變，可以和據點、共照中心的專業人員討論怎麼調整。",ref:["S5-017"]}]},{id:"talk",five:"",title:"和失智家人說話的方法",cat:"溝通",src:"改編自 106-1 失智症課程講義 Week 3〈BPSD〉、Week 6〈照護原則〉",kw:["溝通","說話","聽不懂","吵架","爭辯","生氣","罵","不認得","講不通","怎麼跟他說"],sum:"不糾正、不爭辯，一次說一件事，溝通會輕鬆很多。",sec:[{h:"常見的情況",p:"講話前後不一致、聽不懂指令，家人一急就糾正或提高音量，結果雙方都更生氣。"},{h:"為什麼會這樣",p:"失智會影響記憶、理解和表達。長輩不是故意不聽，而是真的記不住、想不到詞，或聽不懂太長的句子。他記不住內容，卻會記得被責罵的感覺。"},{h:"先這樣做",li:["從正面靠近，先叫他的名字，看著他的眼睛再說話。","一次只說一件事，句子要短，語氣要慢。","給選擇題，不給問答題：「要穿藍色還是灰色？」","不考他「我是誰」「今天幾號」。","不糾正、不爭辯，先回應他的感受。","不要在他面前和別人耳語或吵架。"]},{h:"用他的話回應",li:["接受他當下認為的事實，不急著說「不是這樣」。","重複他說的關鍵字，讓他知道您聽懂了。","用溫和、低一點的聲音，加上手勢和表情。"],ref:["S5-014","S5-006"]},{h:"什麼時候要求助",p:"如果溝通困難突然變嚴重，或出現新的混亂、嗜睡，可能是身體出了狀況，請就醫。照顧者覺得快要失控時，請打家庭照顧者關懷專線。"}]}],Q1=[{name:"重複問・重複行為",art:"repeat"},{name:"遊走",art:"wander"},{name:"妄想",art:"stolen"},{name:"日夜顛倒",art:"sleep"},{name:"拒絕照顧・煩躁",art:"refuse"}],V1=[{g:"日常照顧",items:["吃飯變少、吃太多或亂吃東西","上廁所與失禁","常見用藥與副作用（由醫師或藥師撰寫）","居家安全與防跌"]},{g:"其他症狀",items:["看到不存在的人、認錯家人","情緒低落、對什麼都沒興趣","生氣、打人時怎麼辦"]},{g:"中重度照顧",items:["長時間臥床：翻身、皮膚照顧","吞嚥困難與餵食","要不要插鼻胃管","末期的舒適照護與安寧"]},{g:"照顧者",items:["照顧者的壓力與自我照顧","家人之間怎麼分工","要不要告訴長輩他得了失智症"]},{g:"特定族群與法律",items:["年輕型失智症家庭","財產保護、監護宣告與信託"]}],H1={q1:{q:"家人有去醫院檢查過，醫生說是失智症嗎？",step:1,opts:[["有，醫生說是失智症","q2"],["還沒去檢查，或不確定","r_diag"]]},q2:{q:"吃飯、洗澡、上廁所、走路，需要別人幫忙嗎？",step:2,opts:[["需要人幫忙","q3"],["大多自己可以","r_site"]]},q3:{q:"家裡有請外籍看護嗎？",step:3,opts:[["有請","r_ltc_fw"],["沒有","r_ltc"]]},r_diag:{title:"先去檢查與看診：6 個步驟",plan:"diag",hot:["dem","1966"]},r_site:{title:"白天可以去的地方：6 個步驟",plan:"day",hot:["fam","dem"]},r_ltc:{title:"請照顧專員到家裡看看：申請長照的 5 個步驟",plan:"ltc",hot:["1966","fam"]},r_ltc_fw:{title:"請了看護，也能申請長照：5 個步驟",plan:"ltc",sit:["fw"],hot:["1966","fam"]}},X1={ltc:{checked:"2026-10-30",intro:"打一通 1966，照管專員會到家了解狀況，再幫您安排服務。從申請到開始服務，衛福部預估大約兩週，各縣市不同。",steps:[{id:"call",h:"打 1966 申請長照評估",when:"今天就可以做",do:["撥 1966：週一至週五 8:30–12:00、13:30–17:30，手機、市話都能打，前 5 分鐘免費。","電話會轉到您所在縣市的長照管理中心。替住在外縣市的家人申請，可以在語音選單選家人住的縣市。","也可以直接打臺中市長照管理中心 04-2515-2888；家人住院時，可以請醫院的出院準備小組幫忙申請。"],prep:["長輩的姓名、住址、聯絡電話，以及您的聯絡方式。","已經確診失智症的話，準備醫院的診斷證明或身心障礙證明。官方沒有公告應備文件清單，請依照管中心說明準備。"],next:["照管專員會打電話和您約到家評估的時間。"],ask:["大概什麼時候會來評估？","評估那天需要準備哪些資料？"],tip:"申請條件：65 歲以上、55 歲以上原住民、領有身心障礙證明者。失智症者從 2026 年 1 月 1 日起不限年齡，年輕型失智也能申請。"},{id:"note",h:"評估前，先寫下真實的照顧狀況",when:"等評估的這幾天",do:["用一張紙寫下最近兩週的實際狀況：吃飯、洗澡、上廁所、走路需要多少幫忙。","寫下精神行為症狀發生的頻率，例如一週走失幾次、半夜醒來幾次、一天重複問幾次、是否拒絕洗澡吃藥。","列出目前看哪些科、吃哪些藥，藥袋可以直接拿出來。","寫下您最需要的幫忙，例如白天有人陪、讓您休息幾天、接送看病。"],tip:"這是實務建議：不少長輩在陌生人面前會表現得比平常好，說「我都自己來」。評估當天最好由最了解狀況的家人在場，必要時把紙條交給照管專員，或另外找時間說明，避免等級評得比實際需要低。"},{id:"assess",h:"照管專員到家評估、核定等級",next:["照管專員會用衛福部的「照顧管理評估量表」，了解日常生活能力、溝通、認知與特殊照顧需求。","照管中心依結果核定「長照需要等級」第 1 到 8 級，第 2 級以上才有給付，同時訂出照顧問題清單和每月額度。"],cost:["照顧及專業服務：每月額度依等級，第 2 級 10,020 元、第 4 級 18,580 元、第 6 級 28,070 元、第 8 級 36,180 元；沒用完的額度可以保留 6 個月。","喘息服務：每年 32,340 元（第 2–6 級）或 48,510 元（第 7–8 級）。","交通接送：每月 1,680–2,400 元，依居住地區分四區。","輔具及居家無障礙改善：每 3 年 4 萬元；2026 年 7 月 1 日起可改選 6 萬元方案，包含智慧科技輔具。","部分負擔：一般戶自付 16%（輔具、交通 21–30%）；領中低收入老人生活津貼或身心障礙者生活補助等，自付 5%；低收入戶、中低收入戶不用自付。"],ask:["我們核定的是第幾級？每個月額度多少？","我們屬於哪一類部分負擔？","依我們的情況，建議優先用哪些服務？"]},{id:"plan",h:"和個管員一起擬照顧計畫",next:["照管中心會派一位個案管理員（A 單位）聯絡您，依核定的額度擬照顧計畫。"],do:["說出最需要的服務和時段，例如平日白天有人到家、每月幾天喘息、看病接送。","問清楚由哪個服務單位提供、什麼時候開始。"],tip:"衛福部流程圖的預估：申請到核定約 4 天、擬照顧計畫約 3 天、服務單位開始服務約 7 天，合計大約兩週；實際依各縣市而定。"},{id:"start",h:"開始使用服務，有變化就找個管員",do:["服務單位會和您約時間開始服務。","服務不合適、時段要改、長輩狀況變差，都可以找個管員調整，也可以詢問是否需要重新評估等級。"],sites:"center"}],script:{h:"打 1966 時可以這樣說（請換成您家的情況）",text:"您好，我想幫我父親申請長照服務。他今年 78 歲，住在臺中市北區，醫生說他是失智症。最近他常忘記吃飯、晚上不睡覺，上個月還走失過一次。我白天要上班，家裡沒人照顧。請問要怎麼申請評估？"},sits:[{id:"fw",label:"家裡請了外籍看護",tips:["不能使用居家照顧服務（有人到家幫忙洗澡、做家事）；照顧類服務最多只能用額度的三成，而且限居家服務以外的項目。","仍可使用：專業服務（例如復能、到家指導）、交通接送、輔具及無障礙改善、到宅沐浴車、喘息服務、預防及延緩失能服務、失智共照中心與據點。","看護請假返鄉、轉換雇主、期滿離境、行蹤不明，或正在申請看護的期間，出示證明就能暫時使用全部長照服務，包括居家服務。","看護因故無法照顧時，也可以申請喘息服務。"]},{id:"work",label:"我還在上班",tips:["家人生重病或發生重大事故需要親自照顧時，可以請家庭照顧假：一年最多 7 天，併入事假計算、不給薪，雇主不能拒絕，也不能因此給您不利的處分。","照顧家人的事假可以按小時請，也不能因此影響全勤獎金（勞工請假規則，2026 年 10 月 1 日起施行）。","目前法規沒有一般勞工為照顧家人申請的留職停薪，可以問公司有沒有自訂的照顧假或彈性工時。","和個管員討論服務時段時，告訴對方您的上班時間。"]},{id:"young",label:"家人未滿 65 歲",tips:["失智症者從 2026 年 1 月 1 日起申請長照不限年齡。","打 1966 時直接說明是失智症，並準備診斷證明。","工作、收入與保險的問題，可以向共照中心的個管師或家庭照顧者專線諮詢。"]},{id:"money",label:"家裡經濟有困難",tips:["低收入戶、中低收入戶使用長照不用自付部分負擔。","領中低收入老人生活津貼（部分款別）或身心障礙者生活補助，自付比例降為 5%。","不確定是否符合資格，可以向戶籍所在地的區公所詢問。"]}],local:["臺中市長期照顧管理中心：04-2515-2888。服務站在豐原、北區、南區、清水、東勢。","臺中市衛生局總機：04-2228-9111。"],hot:["1966","fam"],refs:[{name:"衛福部 1966 長照專區：申請長照服務",url:"https://1966.gov.tw/LTC/cp-6533-70777-207.html",date:"2026 年新制"},{name:"長期照顧服務申請及給付辦法（含附表二、附表五：給付額度與部分負擔）",url:"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070059",date:"114-06-19 修正"},{name:"衛福部「長期照顧服務流程」圖（各階段時效）",url:"https://www.mohw.gov.tw/dl-91415-277c0868-3e8d-41eb-9e92-3681f4195eb7.html",date:"2024-09"},{name:"衛福部 1966 長照專區：聘僱外籍家庭看護工家庭可使用的長照服務",url:"https://1966.gov.tw/LTC/cp-6460-69943-207.html",date:"114-06-03 更新"},{name:"衛福部 1966 長照專區：各縣市長期照顧管理中心聯繫窗口",url:"https://1966.gov.tw/LTC/cp-6443-69944-207.html",date:"115-09-29 更新"},{name:"臺中市政府衛生局：長照服務常見問答",url:"https://www.health.taichung.gov.tw/26198/1614263/1617544/1617545/1620753/1660500/post",date:"2025-12-29 異動"},{name:"性別平等工作法（第 20、21 條家庭照顧假）",url:"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030014",date:"112-08-16 修正"},{name:"勞工請假規則（第 7、9 條）",url:"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030006",date:"115-10-01 施行"}]},diag:{checked:"2026-10-30",intro:"懷疑家人失智，先帶去神經內科或精神科檢查。確定診斷通常要回診幾次，台灣失智症協會說明約需 3 到 6 個月；這段期間共照中心可以協助。",steps:[{id:"observe",h:"先觀察，把變化寫下來",when:"這一兩週",do:["對照失智症十大警訊，例如：記憶力減退到影響生活、對時間地點感到混淆、東西擺放錯亂又找不回來、判斷力變差、從工作或社交活動中退出、情緒和個性改變。","可以用台灣失智症協會網站上的 AD-8 線上檢測，比較家人和過去幾年相比「有沒有改變」；勾選 2 題以上，建議進一步就醫。這只是篩檢，不是診斷。","把具體例子寫下來：從什麼時候開始、發生了什麼事、多久一次。"],tip:"國健署說明，沒有症狀的長輩不需要做全面篩檢；出現警訊時才需要評估。"},{id:"book",h:"掛號：神經內科或精神科",when:"決定就醫後",do:["掛神經內科或精神科；許多醫院設有「記憶門診」。","臺中市有 12 家醫院設有失智共同照護中心（共照中心），在這些醫院看診，確診後銜接個案管理比較方便。"],cost:["不需要轉診單也能掛號，但沒有轉診的部分負擔比較高：醫學中心 420 元（有轉診 170 元）、區域醫院 240 元（有轉診 100 元）、地區醫院 80 元（有轉診 50 元）、診所 50 元。","持有身心障礙證明的人，不論醫院層級都是 50 元。","另外還有醫院自訂的掛號費，以及藥品部分負擔。"],sites:"center"},{id:"prep",h:"看診前準備好這些",when:"看診前一天",do:["請最了解狀況的家人陪同，最好是主要照顧者。醫師需要向家屬問清楚最早出現的症狀和發病經過。"],prep:["第 1 步寫下的症狀紀錄。","目前吃的所有藥，直接帶藥袋也可以。","過去的病史，例如中風、頭部外傷、憂鬱、三高。","健保卡；有轉診單也一起帶。"],tip:"這是實務建議：有些話不方便當著長輩的面說，可以先寫在紙上交給醫師，或在掛號時請護理師協助轉達。"},{id:"exam",h:"看診與檢查，通常要回診幾次",next:["醫師會問病史，做身體、神經學和精神狀態檢查，並排除譫妄、憂鬱、藥物副作用等可能。","認知功能評估：至少會做「簡易智能量表（MMSE）」和「臨床失智評估量表（CDR）」，有些醫院會另外安排較完整的評估。","抽血：檢查甲狀腺、維生素 B12、肝腎功能等，先排除可以治療的原因。","腦部影像：至少做一次電腦斷層或核磁共振。"],ask:["是哪一種失智症？目前大約是什麼程度？","有沒有可以治療的原因？","下次什麼時候回診？要做哪些檢查？","需要轉介共照中心嗎？"],tip:"如果醫師說是「輕度認知障礙」，不代表一定會變成失智症：每年約 10–15% 會進展成失智症，也有人會恢復正常。若原因是憂鬱、維生素 B12 或葉酸缺乏、藥物副作用，治療後可能改善。請和醫師約好追蹤的時間。"},{id:"center",h:"請共照中心陪您走這段路",next:["醫院診斷為「疑似」或「確診」失智後，填寫申請書，就能由共照中心收案。","疑似的個案：共照中心會在 6 個月內協助完成就醫診斷與評估。","確診後：個案管理師每月提供諮詢，原則上一年，可以延長。內容包括照顧技巧、追蹤就醫與長照使用、轉介失智據點、福利申請、防走失、法律與財產信託諮詢。"],cost:["共照中心的服務由政府計畫支付，衛福部文件沒有列出向個案收費的項目。"],sites:"center"},{id:"welfare",h:"確診後，申請這些福利",do:["長照服務：失智症者不限年齡，經照管專員評估達第 2 級以上就能使用。請打 1966，步驟見「找資源」的申請長照計畫。","身心障礙證明：到戶籍所在地的區公所申請，帶 3 個月內一吋半身照片 3 張、身分證影本，再到指定醫院鑑定，由社政單位做需求評估後核發。","重大傷病卡：只有部分失智症符合，需由精神科或神經科專科醫師開立診斷書。輕度又沒有精神行為症狀的失智症通常不符合，請問主治醫師。","用藥：由醫師依認知評估結果決定；開始用藥後，每年要重新做認知評估。"],tip:"台灣失智症協會提醒，第一次看診通常無法馬上申請身心障礙證明，一般要 3 到 6 個月確診後才能協助申請。"}],script:{h:"掛號或向醫師說明時，可以這樣說（請換成您家的情況）",text:"您好，我想幫我母親掛記憶門診。她今年 72 歲，這半年常常忘記剛說過的話，同一件事一天問好幾次，上個月煮飯忘記關火兩次，也開始懷疑錢被偷。我們想確認是不是失智症。"},sits:[{id:"refuse",label:"家人不願意去看醫生",tips:["用看失眠、痠痛、頭痛等其他小毛病的名義帶去。","請長輩陪您看病；您先進診間跟醫師說明，再請長輩進去。","用 65 歲以上每年免費的成人健康檢查當理由。","請長輩最重視的家人陪同，例如長子或孫子女。","順路帶去：去長輩常去的市場、公園時，一起到醫院。","真的不肯出門，可以先打電話給共照中心的個管師，討論怎麼就醫。"]},{id:"mci",label:"醫生說是輕度認知障礙",tips:["輕度認知障礙每年約 10–15% 會進展成失智症，也有人會恢復正常。","目前沒有藥物證實能降低惡化成失智症的風險；請和醫師約好追蹤時間。","若是憂鬱、維生素 B12 或葉酸缺乏、藥物副作用造成，治療後可能改善。"]},{id:"young",label:"家人未滿 65 歲",tips:["共照中心已擴大服務年輕型失智症者。","確診後，長照服務不限年齡。","看診時把工作上的具體變化告訴醫師，例如常出錯、無法完成原本熟悉的工作。"]},{id:"work",label:"我還在上班",tips:["陪家人看診可以請事假；照顧家庭成員的事假可以按小時請，也不能因此影響全勤獎金（勞工請假規則，2026 年 10 月 1 日起施行）。","家人嚴重疾病需要親自照顧時，可以請家庭照顧假，一年最多 7 天，併入事假計算、不給薪。"]}],local:["臺中市 12 家醫院設有失智共照中心（臺中市衛生局資源表，115 年 9 月 30 日版）。可在「附近據點」依行政區查詢。","臺中市衛生局失智照護窗口：04-2228-9111 分機 71093、71094、71095、71098。"],hot:["dem","1966"],refs:[{name:"台灣失智症協會：認識失智症（十大警訊）",url:"http://www.tada2002.org.tw/About/IsntDementia",date:"頁面未標日期"},{name:"台灣失智症協會：AD-8 線上檢測",url:"https://www.tada2002.org.tw/About/OnlineOtherCheck",date:"頁面未標日期"},{name:"國民健康署：是否需進行失智症全面篩檢？",url:"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=828&pid=4598",date:"2026-04-21 更新"},{name:"健保署：門診、急診部分負擔",url:"https://www.nhi.gov.tw/ch/cp-5163-9803c-2737-1.html",date:"114-04-22 更新"},{name:"衛福部《失智症診療手冊》（三版）",url:"https://www.mohw.gov.tw/dl-27189-8993c3ad-0f47-45e0-a602-6a4362faae9a.html",date:"106 年 2 月"},{name:"臺大醫院神經部：記憶門診",url:"https://www.ntuh.gov.tw/neur/Fpage.action?fid=4200",date:"2026-10-01 更新"},{name:"臺北市立聯合醫院：長輩不願意去看醫生怎麼辦？",url:"https://tpech.gov.taipei/News_Content.aspx?n=FE839A417C34EB68&sms=87415A8B9CE81B16&s=CB773683A5733229",date:"114-09-11 更新"},{name:"衛福部 115 年度「失智照護服務計畫」申請作業須知",url:"https://www.mohw.gov.tw/dl-98562-a8af20de-036e-4dab-86ad-93ed0c873452.html",date:"115 年 2 月修正"},{name:"台灣失智症協會：身心障礙證明",url:"https://ssc.tada2002.org.tw/support_welfare01.html",date:"頁面未標日期"},{name:"身心障礙者鑑定作業辦法",url:"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020020",date:"115-06-29 修正"},{name:"健保署：免部分負擔（重大傷病）範圍",url:"https://www.nhi.gov.tw/ch/cp-6089-0c619-2957-1.html",date:"115-10-14 更新"},{name:"健保署：藥品給付規定（第 1 節）",url:"https://www.nhi.gov.tw/ch/np-3397-1.html",date:"115-08-21 版"},{name:"長期照顧服務申請及給付辦法",url:"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070059",date:"114-06-19 修正"},{name:"臺中市政府衛生局：臺中市失智照護服務資源單位",url:"https://www.health.taichung.gov.tw/26198/1614263/1617544/1620768/1621018/1679210",date:"2026-10-02 發布"}]},day:{checked:"2026-10-31",intro:"已確診、生活大多還能自理的家人，白天可以去失智社區服務據點上課、交朋友，您也能有一段喘息的時間。以下步驟幫您找到合適的地方。",steps:[{id:"fit",h:"先確認適合哪一種地方",when:"今天就可以做",do:["已確診、臨床失智評估量表（CDR）0.5–1 分，還沒失能或長照等級在第 3 級以下：適合「失智社區服務據點」。","有明顯的精神行為症狀，例如躁動、妄想：可以考慮醫院辦的「權責型」據點，收長照等級第 5 級以下，每週開 5 天、每班最多 12 人。","還沒確診，或想先從一般活動開始：可以去「巷弄長照站（C 據點）」，不需要照管中心評估，失智長輩是優先對象。","生活需要較多幫忙、長照等級第 2 級以上：可以使用日間照顧中心（見第 6 步）。"],tip:"CDR 分數和長照等級由醫師、照管專員評估。不確定的話，問看診醫師或共照中心的個管師。"},{id:"papers",h:"準備證明文件",prep:["1 年內的失智症診斷證明書；如果沒有寫失智程度，另附 CDR 0.5 或 1 分的報告。","或：有效期內的身心障礙證明（失智相關、輕度）。","要去權責型據點，另需 1 年內的精神行為症狀評估結果，請看診醫師協助。"],next:["到據點時要填服務申請書、簽服務說明書，並同意把資料登錄到衛福部的失智照護服務系統。"]},{id:"find",h:"找據點、打電話問清楚",do:["臺中市有 52 處失智據點（一般型 50、權責型 2，衛生局 115 年 9 月 30 日版），大多週一到週五全日開放，少數只開部分時段。","挑離家近、交通方便的；也可以請共照中心的個管師幫忙轉介。"],ask:["每週哪幾天、什麼時段有課？他一週可以來幾次？","有沒有供餐？餐費多少？","有沒有接送？附近怎麼到？","可以先陪同參觀，或試上一次嗎？","有沒有照顧者課程或支持團體？"],sites:"site"},{id:"trial",h:"先陪同參觀、試上",do:["第一次先陪他去參觀，介紹工作人員給他認識。","從他喜歡、生活化的活動開始，例如唱歌、種菜、運動。","用中性的說法，例如「去上益智課」「去找朋友聊天」，避免說「失智班」。","說好什麼時候來接他，並準時出現，讓他安心。"],tip:"這些是協會、醫院與長照單位分享的實務經驗，不是官方規定。如果他最近情緒或精神狀況不穩，先回診和醫師討論。"},{id:"cost",h:"了解費用與交通",cost:["一般型據點：計畫沒有訂部分負擔。若有精神行為症狀，每次一般戶 60 元、第 2 類 30 元、第 1 類免付。","權責型據點：每個時段一般戶 60 元、第 2 類 30 元、第 1 類免付。","共餐可能另收餐費，各據點不同。","巷弄長照站：收費依各站規定，請直接詢問。","交通：長照等級第 2 級以上，可以用長照額度的「社區式服務交通接送」往返日照或據點，10 公里內每趟 115 元，依身分自付部分費用。還沒失能的長輩沒有長照交通給付，要問據點有沒有接送。"]},{id:"next",h:"狀況改變時，銜接日照與長照",next:["病況進展到 CDR 2 分以上，或長照等級第 4 級以上時，據點會在 6 個月內協助轉介照管中心和個管員，改用日間照顧等長照服務。","日間照顧需經評估達長照等級第 2 級以上，使用「照顧及專業服務」每月額度，一般戶自付 16%。","之後需要更多照顧時，還有失智團體家屋、住宿式長照機構等選擇。"],do:["生活需要較多幫忙時，可以先打 1966 申請評估，步驟見「找資源」的申請長照計畫。"]}],script:{h:"打給據點時，可以這樣問（請換成您家的情況）",text:"您好，我父親今年 76 歲，住在北區，去年確診失智症，醫生評估 CDR 1 分，生活大多還能自理。想請問據點每週哪幾天有課、有沒有供餐和接送？我們可以先去參觀一次嗎？"},sits:[{id:"refuse",label:"家人不願意去",tips:["先陪他參觀、試上，讓他認識工作人員和環境。","用中性的說法，例如「去上課」「去當小幫手」；自尊心強的長輩，可以說是家人需要他幫忙。","從他過去喜歡的活動開始，例如種菜、唱歌、下棋。","請他幫忙保管一樣東西，說好幾點來接，讓他安心。","小一點的據點比較有彈性，偶爾沒去也沒關係。"]},{id:"bpsd",label:"家人有躁動、妄想等症狀",tips:["可以考慮醫院辦的權責型據點，臺中有台中慈濟醫院（潭子）和童綜合醫院（沙鹿）。","每週開 5 天、每班最多 12 人，有專職的醫事人員，也有緊急應變計畫。","需要 1 年內的精神行為症狀評估結果，請看診醫師協助。"]},{id:"carer",label:"我自己也需要支持",tips:["臺中市有 9 處家庭照顧者支持服務據點（衛生局 115 年 9 月 16 日公告名冊），提供照顧資訊與轉介、照顧技巧訓練、喘息服務媒合與情緒支持。","失智據點本身也有照顧者課程或支持團體，可以一起參加。","想找人聊聊，可以打家庭照顧者關懷專線。"]},{id:"work",label:"我還在上班",tips:["多數據點週一到週五全日開放，可以安排平日白天去。","需要整天照顧、且長照等級第 2 級以上時，日間照顧中心比較能配合上班時間，也能用長照的交通接送。"]}],local:["臺中市失智社區服務據點 52 處（衛生局 115 年 9 月 30 日版資源表）。可在「附近據點」依行政區查詢。","巷弄長照站（醫事 C 據點）約 133 處：衛生局一覽表（115 年 10 月更新）。","家庭照顧者支持服務據點 9 處：衛生局名冊（115 年 9 月 16 日）。","臺中市衛生局失智照護窗口：04-2228-9111 分機 71093、71094、71095、71098。"],hot:["fam","dem"],refs:[{name:"衛福部 115 年度「失智照護服務計畫」申請作業須知（分項計畫二、三：失智據點、權責型據點）",url:"https://www.mohw.gov.tw/dl-98562-a8af20de-036e-4dab-86ad-93ed0c873452.html",date:"115 年 2 月修正"},{name:"臺中市政府衛生局：臺中市失智照護服務資源單位（附件 2：據點資源表 115.9.30）",url:"https://www.health.taichung.gov.tw/26198/1614263/1617544/1620768/1621018/1679210",date:"2026-10-02 發布"},{name:"臺中市政府衛生局：C 據點長照站（醫事 C）資源一覽表",url:"https://www.health.taichung.gov.tw/1633355/post",date:"2026-10-21 發布"},{name:"臺中市政府衛生局：臺中市家庭照顧者支持性服務單位",url:"https://www.health.taichung.gov.tw/1655489/post",date:"2026-09-16 發布"},{name:"衛福部 1966 長照專區：交通接送服務",url:"https://1966.gov.tw/LTC/cp-6452-69937-207.html",date:"114-10-23 更新"},{name:"長期照顧服務申請及給付辦法（附表四照顧組合、附表五部分負擔）",url:"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070059",date:"114-06-19 修正"},{name:"衛福部：家庭照顧者支持服務原則",url:"https://www.mohw.gov.tw/dl-77951-90ae6afd-360f-42fe-b54c-cf3e8cf46847.html",date:"2018-08-21"},{name:"衛福部長照服務資源地理地圖",url:"https://ltcpap.mohw.gov.tw/public/index.html",date:""},{name:"元氣網：長輩不願去據點怎麼辦（WaCare 論壇報導）",url:"https://health.udn.com/health/story/120650/9740988",date:"2026-09-08"}]}},U1=["今天如果只做到一半，也已經很努力了。","他忘了您是誰，但記得被好好對待的感覺。","請別人幫忙，不是放棄，是讓這條路走得更久。","生氣不代表您不愛他，代表您真的累了。","今天找一件只為自己做的小事，五分鐘也好。","您不需要每次都做對，只需要繼續陪著。","把喘息服務當成照顧的一部分，不是額外的奢侈。"],J1={checked:"2026-11-01",title:"認識失智症：病因、類型與病程",lead:"失智症是一種疾病，不是正常老化。了解家人是哪一種類型、目前在哪個階段，就比較知道接下來會發生什麼、可以怎麼準備。",what:"失智症是一群症狀的組合，不只是記憶變差，還包括語言、方向感、計算、判斷、注意力等能力退化，也可能出現個性改變、妄想或幻覺，嚴重到影響工作、人際和日常生活。超過九成的失智症者在病程中會出現精神行為症狀。",compare:[["忘記的事，事後或經人提醒會想起來","經人提醒也不容易想起來，對自己說過的話、做過的事完全忘記"],["覺得自己記性變差，自己比家人還擔心","大多不覺得自己有問題，家人比本人更擔心"],["在熟悉的地方不太會迷路","會迷路，或要花很久才找到路"],["說話偶爾想不起某個詞","說話常中斷，或用別的詞代替"],["還學得會使用新的用具","漸漸學不會新的東西"]],stats:{cards:[{n:"近 40 萬人",d:"2026 年台灣失智人口（全年齡推估）"},{n:"7.99%",d:"65 歲以上失智症盛行率（女 9.36%、男 6.35%）"},{n:"逾 69 萬人",d:"2041 年推估失智人口（全年齡）"},{n:"70.69%",d:"2025 年底失智症確診率（約 26 萬人已確診）"}],ages:[["65–69 歲","2.40%"],["70–74 歲","5.16%"],["75–79 歲","9.10%"],["80–84 歲","16.00%"],["85–89 歲","20.04%"],["90 歲以上","29.45%"]],world:"全球約 5,700 萬人有失智症（2021 年），每年新增近 1,000 萬人。",ref:["P3-p.4–5、22","P4-盛行率表","E1-新聞稿","W1-網頁"]},mci:"介於正常和失智之間的狀態叫「輕度認知障礙」：會忘記最近的事、處理複雜的事有困難，但不影響日常生活。2011–2013 年的全國調查顯示，台灣 65 歲以上約 18.8% 有輕度認知障礙（最新一次調查尚未公布這項數字）；每年約 10–15% 會進展成失智症，也有人會恢復正常，所以要定期追蹤。",whatRef:["M1-手冊頁 2–3、10–11","T1-網頁","H1-p.3"],causes:[{h:"退化性",p:"腦細胞逐漸退化，病程緩慢、無法逆轉。最常見的類型都在這一類。",items:["阿茲海默症","路易氏體失智症","額顳葉失智症","帕金森病失智"]},{h:"血管性",p:"中風或長期腦血管病變造成，是失智症第二大原因。控制血壓、血糖、血脂，預防再中風是治療重點。"},{h:"可以治療的原因",p:"少於 5%，但找出來治療後可能改善，所以一定要就醫檢查。",items:["維生素 B12、葉酸缺乏","甲狀腺功能低下、電解質不平衡","常壓性水腦症、腦瘤、腦部外傷、硬腦膜下出血","梅毒、腦膜炎、愛滋病等感染","肝腎功能異常、低血糖等代謝問題","紅斑性狼瘡等免疫疾病","一氧化碳、金屬中毒，藥物副作用、酗酒","憂鬱症也可能讓人看起來像失智，治療後可改善"]}],causeRef:["M1-手冊頁 13–14","T1-網頁","H1-網頁","K2-投影片 48–49"],risk:{p:"2024 年《刺胳針》（Lancet）失智症委員會整理出 14 項可以改變的危險因子，若都能避免，約 45% 的失智症有機會預防或延後發生。對照顧者自己和其他家人也很重要。",items:["年輕時受教育較少","聽力損失（可配戴助聽器）","視力損失","高血壓","糖尿病","低密度膽固醇（壞膽固醇）過高","肥胖","缺乏運動","抽菸","過量飲酒","憂鬱","社會孤立","頭部外傷","空氣汙染"],ref:["LC-2024 報告"]},types:[{name:"阿茲海默症",tag:"最常見，台灣約占 57%",first:"最近發生的事記不住，接著對時間、地點、人物的辨認出問題。病變最早侵犯掌管記憶的海馬迴，所以新發生的事最先忘記。",course:"緩慢漸進。整體病程約 8–10 年，個別差異大。",signs:["早期很少有幻覺；中期常出現被偷、忌妒、被害等妄想","語言障礙與動作變慢多在後期才明顯","多在 70 歲以後發病"],care:["先從維持原有生活能力開始，給予規律作息","中期的妄想不否定、也不附和，先安撫情緒、轉移注意力"],ref:["M1-手冊頁 14–16","T1-網頁","H1-網頁","P1-網頁","K2-投影片 32–34","P4-類型比例"]},{name:"血管性失智症",tag:"第二常見，台灣約占 23%",first:"常在中風後幾個月內出現，不一定先從記憶開始；動作和反應變慢、走路不穩。",course:"分兩種：一次中風後突然出現的「中風後型」，呈階梯式退化，每次中風後變差、治療後可能穩定一段時間；另一種「小血管型」則像阿茲海默症一樣逐漸變差。",signs:["情緒低落、個性改變；血管性失智症合併憂鬱的比例相當高","尿失禁","吞嚥或說話困難、情緒失控（突然哭或笑）","容易跌倒"],care:["按時服藥，控制血壓、血糖、血脂，預防再次中風","留意吞嚥嗆咳與跌倒","突然明顯變差時，要就醫檢查是否再中風","少數是遺傳性的（CADASIL），約 50 歲就第一次中風、常伴隨偏頭痛；家族中有人年輕中風又失智，請告訴醫師"],ref:["T1-網頁","M1-手冊頁 14–16","V1-血管性失智症","K2-投影片 43–47"]},{name:"路易氏體失智症",tag:"台灣調查約 2.6%，症狀時好時壞",first:"早期就看到非常鮮明的影像（視幻覺），注意力和清醒程度時好時壞；記憶在早期不一定明顯受損。",course:"症狀起伏大，今天和昨天可能判若兩人。病程約 5–7 年。",signs:["手抖、身體僵硬、走路不穩，不明原因反覆跌倒","睡夢中大叫、揮手踢腳，把夢境演出來","也可能有聽幻覺、情緒不穩、疑心或妄想","醫師判斷時看四個特徵：注意力時好時壞、睡夢中演出夢境、視幻覺、類似帕金森的動作障礙"],care:["對抗精神病藥物非常敏感，可能讓動作障礙惡化，用藥一定要和醫師討論，不要自行增減","特別注意防跌","看到幻覺時先安撫，不必爭辯「那不存在」"],ref:["M1-手冊頁 6、14–16","V1-路易氏體失智症","T1-網頁","K2-投影片 35–36","J1-類型比例"]},{name:"額顳葉失智症",tag:"台灣調查約 1%，發病較早",first:"個性和行為先改變，或說話、叫東西名稱出現困難；記憶反而不一定先變差。",course:"常見於 45–65 歲發病，病程約 2–10 年。約三成有家族史。",signs:["失去禮儀、說話不得體、衝動亂花錢","變得冷漠被動，不在意儀容","固執、重複同樣的行為、囤積東西","飲食改變：特別愛吃甜食、暴飲暴食","依最早受影響的能力分成幾種：約六成是「行為型」，以個性、行為改變為主；約兩成是「語意型」，聽得到字卻不懂意思；約兩成是「非流暢型」，知道要說什麼卻說不出來","約 15% 會合併運動神經元疾病（漸凍症），出現口齒不清、吞嚥困難、容易嗆咳、四肢無力，常有家族遺傳"],care:["這些行為是疾病造成，不是故意的；先保護他避免衝突或財務損失","固定作息，把容易出事的物品（信用卡、甜食）妥善收好","一般的失智症用藥對這一型無效，照顧以行為處理為主"],ref:["M1-手冊頁 14–16","V1-額顳葉失智症","T1-網頁","K2-投影片 38–42","J1-類型比例"]},{name:"帕金森病失智",tag:"台灣約占 7%",first:"先確診帕金森病，至少一年以後才出現失智症狀。",course:"隨帕金森病進展，動作與認知功能逐漸變差。",signs:["手抖、動作慢、身體僵硬","跌倒風險高","70 歲以後才得帕金森病、男性、有憂鬱，或已出現幻覺、淡漠的人，比較容易發展成失智"],care:["和神經科醫師討論用藥：治療帕金森與精神症狀的藥物可能互相影響","特別注意防跌"],ref:["P1-網頁","M1-附錄六","K2-投影片 37"]},{name:"混合型",tag:"同時有兩種以上原因",first:"最常見的是阿茲海默症合併血管性失智症，兩種症狀都可能出現。",course:"依主要原因而定，同時要預防中風。",signs:["兼有記憶退化與中風相關症狀"],care:["除了失智照顧，也要控制三高、預防再中風"],ref:["T1-網頁","H1-網頁"]}],stages:[{cdr:"0.5",label:"極輕度",summary:"記憶開始常常出錯，但生活起居仍能完全自理。手冊稱為「可疑失智」，失智症協會與共照手冊稱為「極輕度」。",signs:["常忘記最近的事，只能想起一部分","和時間先後有關的事情稍有困難","處理複雜的事、參加社交活動稍有影響","生活起居仍能完全自理"],care:["本人和家人一起了解病程與症狀，學習調適","多參加認知促進活動，維持生活與社會參與","建立規律作息與運動等好習慣，延緩退化","趁本人還能表達，開始談未來的醫療與財務安排"],svc:[{label:"共照中心",go:"sites",kind:"center"},{label:"失智據點",go:"sites",kind:"site"},{label:"找資源：白天可以去的地方",navr:"r_site"},{label:"文章：陪伴活動",art:"activity"}],ref:["M1-附錄三","C1-p.6–7","T1-網頁"]},{cdr:"1",label:"輕度",summary:"最近的事記不住，已經影響生活。外表看起來正常，但需要別人提醒。",signs:["最近發生的事特別記不住，重複問、重複買","時間感混亂，在不熟悉的地方會迷路","較難的家事、複雜的嗜好已經不做；錢財管理容易出錯","無法單獨參加社區活動","需要別人督促或提醒才會打理自己"],care:["維持原有的生活安排，讓他做做得到的事（自立支援）；交付簡單、有目的的工作，幫他維持尊嚴和價值感","穩定參加據點的認知促進活動，作息規律","按時回診，注意用藥安全","學習居家照顧技巧，預防走失與意外","及早規劃：預立醫療決定，以及家庭會議、財產信託、監護或輔助宣告等財產保護","視需要申請長照"],svc:[{label:"失智據點",go:"sites",kind:"site"},{label:"找資源：申請長照",navr:"r_ltc"},{label:"文章：自立支援",art:"selfcare"},{label:"文章：防走失",art:"wander"}],ref:["M1-附錄三、手冊頁 4、46–47","C1-p.6–7","H1-p.21、25","K11-照護原則"]},{cdr:"2",label:"中度",summary:"新的事很快就忘，時間和地點都搞不清楚，穿衣和個人衛生都需要幫忙。多數已合併失能，政府鼓勵改用日照等長照服務。",signs:["只記得反覆學過的事，新的事很快就忘","時間、地點都混淆，在住家附近也可能走失","社會判斷力受影響，無法獨自工作、購物","只能做簡單的家事；穿衣、洗澡需要協助","常見日夜顛倒、妄想、遊走等精神行為症狀，偶有失禁"],care:["著眼於他還保有的能力：先提醒、陪著做，必要時才代勞","作息規律，避免環境經常變動","加強安全看視與防走失","面對妄想不否定也不附和，先安撫、轉移注意力","照顧者要找支持，適時申請喘息"],svc:[{label:"找資源：申請長照",navr:"r_ltc"},{label:"文章：說東西被偷",art:"stolen"},{label:"文章：日夜顛倒",art:"sleep"},{label:"喘口氣",go:"rest"}],ref:["M1-附錄三","C1-p.6–7","H1-p.16–21","P2-網頁"]},{cdr:"3",label:"重度",summary:"只剩片段記憶，只認得熟悉的人，生活起居都需要別人照顧。",signs:["只剩片段的記憶","只認得人，判斷力喪失","無法外出活動、無法做家事","日常生活很依賴他人，常大小便失禁","可能出現吞嚥困難，行動需要輪椅"],care:["照顧者需要心理支持，學習重度照顧技巧","小心餵食，留意吞嚥與嗆咳；反覆吸入性肺炎時，和醫師討論管灌的利弊","避免感冒；痰多時協助濕化痰液、拍痰","家人及早討論急救與送醫的原則","了解失智症的緩和醫療與安寧照護"],svc:[{label:"找資源：申請長照",navr:"r_ltc"},{label:"喘口氣",go:"rest"}],ref:["M1-附錄三","C1-p.6–7","H1-p.30–31"]},{cdr:"4–5",label:"深度／末期",summary:"國際原版量表只到 CDR 3；台灣為了安寧療護，另外訂了 CDR 4（深度）與 5（末期）。",signs:["CDR 4：偶爾只認得配偶或主要照顧者，說話令人難以理解，多坐輪椅，吃飯用手抓，常失禁","CDR 5：沒有反應、無法理解，認不出人，長期臥床、關節攣縮，需要餵食或鼻胃管，大小便完全失禁"],care:["以舒適為目標，和醫療團隊討論是否插管、急救、送醫；停止不必要的藥物，避免反覆住院與侵入性治療","舒適餵食：以安全和可口為主，末期很少有飢餓感，少量就夠；口乾時用少量的水濕潤口腔","依《病人自主權利法》，極重度失智是可以依「預立醫療決定」選擇不接受維生醫療的情況之一；最好在輕度、本人還能表達時，就做預立醫療照護諮商","健保自 2009 年起給付失智末期（CDR 5）的安寧療護，可選住院安寧、安寧共同照護、安寧居家或社區安寧；現行收案條件請向醫院安寧團隊確認","照顧者也要被照顧，善用喘息服務"],svc:[{label:"喘口氣",go:"rest"}],ref:["M1-附錄三、手冊頁 48","H1-p.30–31","K8-舒適照護、病人自主權利法"]}],stageNote:"世界衛生組織把失智照顧分成七個階段：診斷前、診斷、診斷後支持、照顧管理、社區服務、延續照顧、臨終安寧。失智症整體病程平均約 8–10 年，個別差異很大。依 2020–2023 年全國調查，台灣失智者中極輕度約占 41%、輕度 24%、中度 17%、重度 18%（極輕度含部分符合條件的輕度認知障礙者）。",young:{h:"年輕型失智症（65 歲以前發病）",items:["65 歲以前確診的失智症稱為年輕型或早發性失智症，約占失智症的 5%。衛福部採用 30–64 歲盛行率約千分之 1.2 推估人數，目前沒有公布確切人數。","發病時正值工作與家庭責任最重的時期，初期身體強壯、看不出生病，家人常以為「這麼年輕不會失智」或是精神疾病，因而延誤診斷。","和老年型相比，病情進展通常較快；常見原因仍是阿茲海默症與血管性，但額顳葉失智症等遺傳性疾病，以及腦傷、酒精相關的比例較高。","家庭經濟、子女教養是主要擔憂。照顧者多半是配偶，或在學、剛出社會的子女，可能同時要養育孩子、照顧父母；研究中多達六成照顧者有焦慮情緒，配偶也常有憂鬱。","一般為長輩設計的活動和機構不一定適合，年輕型失智者常說「這些我都會、我不需要」。可以找有年輕型團體的單位，安排以生活為基礎、符合興趣與能力、有目的的活動。","照護原則：維持尊嚴和價值感，把焦點放在他的能力與長處，交付簡單的工作；多肯定、少否定，不爭辯、不糾正；了解他的人生經驗，依病程調整照顧方式。","額顳葉失智症常在 65 歲前發病，早期以個性、行為或語言改變為主。","從 2026 年 1 月 1 日起，失智症者申請長照不限年齡；共照中心也已擴大服務年輕型失智症者。","台灣失智症協會在台北設有「Young 記憶會館」，提供諮詢、課程與家屬支持團體；也可以打失智症關懷專線 0800-474-580。"],ref:["T2-網頁","M1-手冊頁 2","L1-網頁","K11-年輕型與老年型比較、照護負擔、照護原則","P3-p.4"]},refs:[{name:"
